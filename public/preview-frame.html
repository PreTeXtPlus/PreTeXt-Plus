<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>PreTeXt preview</title>
    <style>
      /* The editor draws its own loading affordances over this frame, so the
         shim itself should be invisible rather than a white flash of nothing. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <script>
      /*
       * Host page for the editor's live preview.
       *
       * This file is deliberately almost empty: the editor renders PreTeXt to
       * HTML in the browser and hands the finished page here to be written
       * into this document. The only reason this exists as a served file at
       * all — rather than the editor using `iframe.srcdoc` — is that a
       * `srcdoc` document has no URL, and therefore no query string.
       *
       * PreTeXt's print preview needs one. pretext-core.js enters
       * print-preview mode by reading `?printpreview=<id>` from
       * `location.search`, so the preview has to live at a real URL for a
       * worksheet or handout to be previewable at all. That is this file's
       * whole job.
       *
       * The write is performed *here*, from a message handler, and never by
       * the parent reaching in with `contentDocument.write()`: `document.open()`
       * resets the document's URL to that of whichever document called it, so a
       * parent-driven write would throw away the `?printpreview=` this page
       * exists to carry.
       *
       * Keep the message names in step with
       * `packages/web-editor/src/components/previewFrame.ts`, which owns this
       * protocol and injects the equivalent (plus print-link repair) into every
       * page written here — `document.open()` drops this listener, so each
       * written page must re-register its own.
       */
      (function () {
        if (window.parent === window) return;

        window.__ptxFrameWrite = function (event) {
          var data = event.data;
          if (!data || data.type !== "pretext-plus:frame-write") return;
          if (typeof data.html !== "string") return;
          window.__ptxFrameToken = data.token;
          document.open();
          document.write(data.html);
          document.close();
        };
        window.addEventListener("message", window.__ptxFrameWrite);

        // No token: this document came from the network, not from a write, so
        // the editor knows the frame is empty and sends the current render.
        parent.postMessage(
          { type: "pretext-plus:frame-ready", search: location.search },
          "*"
        );
      })();
    </script>
  </body>
</html>
