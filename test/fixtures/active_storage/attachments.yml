#
# Attaches blobs.yml's blob to assets.yml's preview_frame_diagram asset, so
# that asset arrives with a real file already attached -- no upload step
# needed in the tests that use it.

preview_frame_diagram_file:
  name: file
  record: preview_frame_diagram (Asset)
  blob: preview_frame_diagram_blob

image_one_file:
  name: file
  record: image_one (Asset)
  blob: image_one_blob
