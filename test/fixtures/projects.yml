# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html

one:
  user: one
  title: My First Project
  pretext_source: |
    <pretext>
    <article xml:id="document" label="document">
      <title>Hello</title>
      <p>
        World
      </p>
    </article>
    </pretext>
  document_type: article

two:
  user: two
  title: My Second Project
  pretext_source: |
    <pretext>
    <article xml:id="document" label="document">
      <title>Welcome to PreTeXt.Plus!</title>

      <p>
        Hello world
      </p>
    </article>
    </pretext>
  document_type: article

# The only slideshow, and so the only project that may hold a revealjs or beamer target.
slides:
  user: one
  title: My Slide Deck
  pretext_source: <pretext><slideshow><slide><title>First</title><p>Content</p></slide></slideshow></pretext>
  document_type: slideshow

# A subscriber-owned project (collaborator cap 5), used by collaboration
# tests that need room to invite. Holds the :pending invitation fixture.
team:
  user: subscribed
  title: Team Book
  pretext_source: <pretext><book><chapter><title>Team</title><p>Content</p></chapter></book></pretext>
  document_type: book

# A team-curated starter, flagged is_template so it shows up in the
# "Start project from template" chooser. Owned by user two like any other
# project -- templates are ordinary projects the admin UI has flagged.
template:
  user: two
  title: Calc Template
  pretext_source: |
    <pretext>
    <article xml:id="document" label="document">
      <title>Template</title>
      <section xml:id="subdivision">
      <title>Section</title>
      <p>
        Starter content
      </p>
    </section>
    </article>

    </pretext>
  document_type: article
  is_template: true
  template_description: A great starter

# Owned by the subscribed fixture user, whose profile page is publicly viewable --
# this is what shows up there, linked via its published target (see targets.yml).
public_project:
  user: subscribed
  title: A Public Project
  pretext_source: |
    <pretext>
    <article xml:id="document" label="document">
      <title>Public</title>
    </article>
    </pretext>
  document_type: article
  visibility: public

# Public but nothing built and published yet -- exercises the profile's empty state
# for a project that still shouldn't be hidden.
public_project_unbuilt:
  user: subscribed
  title: A Public But Unbuilt Project
  pretext_source: |
    <pretext>
    <article xml:id="document" label="document">
      <title>Unbuilt</title>
    </article>
    </pretext>
  document_type: article
  visibility: public

# Dedicated home for the preview_frame_diagram asset fixture (see assets.yml),
# rather than attaching it to project :one -- several tests
# (test/models/publication/settings_test.rb,
# test/controllers/publication_settings_controller_test.rb) assert an exact,
# exhaustive list of project :one's file-backed images, which a shared
# always-attached fixture would silently join.
preview_frame:
  user: one
  title: Preview Frame Project
  pretext_source: |
    <pretext>
    <article xml:id="document" label="document">
      <title>Preview Frame</title>
    </article>
    </pretext>
  document_type: article
