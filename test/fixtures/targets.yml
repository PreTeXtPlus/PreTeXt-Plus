# Every project has a website target, mirroring both Project::DEFAULT_TARGET (what a new
# project is created with) and the backfill in the CreateTargets migration.
#
# Fixtures are inserted straight into the table, so each row carries the `slug` that
# Target#assign_slug would have derived from its name.

one_web:
  project: one
  name: Website
  slug: website
  kind: website
  position: 0
  latest_build: in_progress

# Two builds, both in flight -- exercises the `building` state.
two_web:
  project: two
  name: Website
  slug: website
  kind: website
  position: 0
  # current_build points at the successful build even though a *later* build failed: a
  # failed rebuild must not take a published output down. This is the divergence between
  # the two pointers that the whole design exists to represent.
  current_build: two
  latest_build: failed
  last_built_at: <%= 3.days.ago.to_fs(:db) %>

# A second website target on the same project. Slugs are unique within a project; kinds
# deliberately are not -- this is how a "student"/"instructor" pair works, and how
# PreTeXt-CLI treats <targets> in project.ptx.
one_instructor:
  project: one
  name: Instructor edition
  slug: instructor-edition
  kind: website
  position: 1

# Configured but never built -- exercises the `never` state.
one_print:
  project: one
  name: Print
  slug: print
  kind: pdf
  position: 2

# Slides, on the one slideshow project. Target::Catalog restricts this kind to
# <slideshow> documents, so it has nowhere else to live.
slides_deck:
  project: slides
  name: Slides
  slug: slides
  kind: revealjs
  position: 0

# Published, so this is what a visitor to the owner's public profile sees linked.
public_project_web:
  project: public_project
  name: Website
  slug: website
  kind: website
  position: 0
  published: true
