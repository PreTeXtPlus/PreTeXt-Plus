# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html

# An authored asset in project one -- deliberately file-less, unlike image_one
# below: several tests (test/models/asset_test.rb, test/models/project_test.rb)
# use this specifically to exercise the "no file attached" case.
authored_one:
  project: one
  kind: authored
  ref: my-activity
  title: My Activity
  short_description: My Activity
  source: ""

# A file-backed asset already in project one under ref "diagram", with its
# file pre-attached via ActiveStorage fixtures (test/fixtures/active_storage/*.yml)
# using test/fixtures/files/test_image.png -- used to test removing/renaming
# an existing asset and the asset-file redirect. Tests that need different
# bytes, content type, or filename (e.g. an extensionless "pasted image", a
# non-image content type, or an SVG) still attach their own override on top
# of this.
image_one:
  project: one
  kind: file
  ref: diagram
  title: A Diagram
  short_description: A Diagram
  source: ""

# In project two (owned by user two), used for cross-user authorization checks.
other_user_asset:
  project: two
  kind: authored
  ref: someone-elses-activity
  title: Someone Else's Activity
  short_description: Someone Else's Activity
  source: ""

# A file-backed asset with its file pre-attached via ActiveStorage fixtures
# (test/fixtures/active_storage/*.yml), unlike image_one above -- this one
# needs real, already-served bytes without an upload step, for tests that
# exercise the actual asset-serving redirect end to end (e.g. the
# preview-frame system test). Lives in its own dedicated :preview_frame
# project (see projects.yml) rather than :one, so it can't join any test's
# exact count/list of project :one's images.
preview_frame_diagram:
  project: preview_frame
  kind: file
  ref: preview-frame-diagram
  title: Preview Frame Diagram
  short_description: Preview Frame Diagram
  source: ""
