# Builds are broadcast from a solid_queue worker, which under bin/dev is a *separate
# process* from the web server. The async adapter only delivers within one process, so
# with it a target row would live-update in production and appear frozen in development.
# The postgresql adapter uses LISTEN/NOTIFY on the primary database, so it crosses the
# process boundary without needing the separate `cable` database production uses.
development:
  adapter: postgresql

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
