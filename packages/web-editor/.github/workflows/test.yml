name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Matches the version publish.yml releases from.
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # The same build publish.yml runs, so a release can never be the first
      # place a build break shows up. `build:demo` is deliberately not run: it
      # currently fails inside @pretextbook/libxslt-wasm (top-level await under
      # the iife worker format), independently of anything in this repo.
      - name: Build library
        run: npm run build
